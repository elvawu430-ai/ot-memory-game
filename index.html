<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff4df"><title>長照專業服務挑戰王</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 10% 8%,#d5f2ff,transparent 30%),linear-gradient(155deg,#fff7e7,#fef0d8);font-family:"Arial Rounded MT Bold","Trebuchet MS","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;color:#174e69}.wrap{max-width:690px;margin:auto;padding:14px 13px 30px;text-align:center}.hero{background:linear-gradient(145deg,#fff9ed,#fff0ce);border:3px solid #fff;box-shadow:0 6px 0 #e5d5bb;border-radius:28px;padding:15px 8px 17px}.title{font-size:clamp(30px,7vw,48px);font-weight:1000;letter-spacing:1px;line-height:1.23;text-shadow:3px 3px 0 white;color:#e96830}.title span{color:inherit}.instruction{display:inline-block;background:#ffdf80;border-radius:40px;padding:9px 16px;margin-top:12px;font-weight:900;font-size:clamp(17px,4.4vw,25px);color:#624023}.panel{background:#fffdf7;border:3px solid #f3e5cb;border-radius:28px;padding:15px;margin-top:15px;box-shadow:0 5px 0 #e6d7c0}.stats{display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:clamp(17px,4.1vw,24px);font-weight:900}.stats strong{color:#e96536;font-size:1.15em}.progress{height:12px;background:#e9e0d1;border-radius:20px;margin:13px 0 17px;overflow:hidden}.progress>div{height:100%;background:#6ab898;width:0;transition:width .3s}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px}.card{border:0;padding:0;aspect-ratio:.78;background:transparent;perspective:800px;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}.card:focus-visible{outline:4px solid #ef913d;outline-offset:3px;border-radius:18px}.inner{width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:transform .4s}.card.flipped .inner,.card.matched .inner{transform:rotateY(180deg)}.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:19px;border:4px solid #fff7e9;box-shadow:0 5px 0 #d9c8ad;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:8px;overflow:hidden}.back{background:linear-gradient(150deg,#77b8d1,#367c9e);color:white}.back svg{width:75%;max-height:64%;filter:drop-shadow(0 2px 1px #2b6482)}.back b{font-size:clamp(16px,4.5vw,28px);text-shadow:2px 2px #265a73;white-space:nowrap}.front{transform:rotateY(180deg);background:#fff6e8;border-color:#fff}.front svg{width:100%;height:76%;max-height:180px}.front b{font-size:clamp(14px,3.4vw,23px);font-weight:1000;line-height:1.15;color:#215b64}.front b.long{font-size:clamp(12px,2.7vw,19px)}.matched .front{background:#e6f6e9;border-color:#8bc5a2}.message{min-height:58px;display:grid;place-items:center;margin:16px 0 10px;padding:9px;border-radius:17px;background:#fff0cc;color:#5d4b2c;font-weight:900;font-size:clamp(16px,3.7vw,23px)}button.reset{background:#ff6e6c;color:white;border:0;border-bottom:6px solid #d34d4f;border-radius:25px;font:900 clamp(20px,4.8vw,29px) inherit;font-family:inherit;font-size:clamp(20px,4.8vw,29px);padding:13px 36px;cursor:pointer;touch-action:manipulation}.finish{display:none;padding:26px 10px}.finish.show{display:block}.finish h2{font-size:clamp(28px,7vw,43px);color:#e76d39;margin:5px}.finish p{font-size:clamp(20px,4vw,26px);font-weight:800}.number{font-size:clamp(90px,20vw,145px);font-weight:1000;color:#df7d2c;background:#fff0c8;border:5px solid #f7c97e;border-radius:35px;width:190px;margin:10px auto} .question-box{background:#fff7e5;border:3px solid #f5c87d;border-radius:25px;padding:20px 16px;margin:18px auto;text-align:left;max-width:590px}.question-label{font-size:clamp(18px,3.8vw,23px);font-weight:1000;color:#d66a2d;margin-bottom:10px}.question-text{font-size:clamp(22px,5vw,31px);line-height:1.6;font-weight:1000;color:#24576a;overflow-wrap:anywhere}.answer-toggle{display:block;width:100%;border:0;border-bottom:5px solid #d77e2d;border-radius:20px;background:#f5a94d;color:#fff;font-family:inherit;font-size:clamp(22px,4.8vw,28px);font-weight:1000;padding:14px 10px;margin:18px auto 0;cursor:pointer;touch-action:manipulation}.answer{display:none;background:#e7f6ed;border:3px solid #98d2b2;border-radius:18px;margin-top:14px;padding:15px;text-align:left;font-size:clamp(19px,4.1vw,25px);font-weight:800;line-height:1.65;color:#256a58}.answer.show{display:block}.answer strong{display:block;color:#28745c;margin-bottom:5px}.hotline{background:#e8f6ec;border-radius:18px;padding:14px;font-size:clamp(19px,4vw,25px);font-weight:900;color:#286f57}.hint{font-size:15px;color:#6c807f;margin:15px 0 0}@media(max-width:390px){.cards{gap:7px}.face{border-width:3px;border-radius:14px;padding:4px}.panel{padding:10px}}

/* 統一比例：以畫面整體視覺平衡為主，不鎖定特定平板尺寸 */
.wrap{max-width:980px;padding:24px 22px 34px}
.hero{padding:19px 16px 21px}
.title{font-size:clamp(34px,5vw,54px);line-height:1.16}
.title br{display:none}
.instruction{font-size:clamp(17px,2.5vw,23px);padding:8px 18px;margin-top:11px}
.panel{padding:19px 24px 23px;margin-top:17px}
.stats{font-size:clamp(17px,2.3vw,22px)}
.progress{margin:12px 0 18px;height:11px}
.cards{max-width:840px;margin:0 auto;gap:16px}
.card{aspect-ratio:1.3;max-height:none}
.face{border-radius:20px;padding:8px}
.front svg{height:73%;max-height:none}
.front b{font-size:clamp(17px,2.5vw,24px)}
.front b.long{font-size:clamp(14px,2vw,20px)}
.back b{font-size:clamp(17px,2.5vw,25px)}
.message{min-height:46px;margin:15px 0 12px;font-size:clamp(16px,2.2vw,21px)}
button.reset{font-size:clamp(19px,2.6vw,25px);padding:11px 34px}
.hint{font-size:14px}
@media(max-width:650px){
 .wrap{padding:12px 10px 24px}
 .hero{padding:14px 8px}
 .title{font-size:clamp(29px,6vw,39px)}
 .title br{display:block}
 .instruction{font-size:clamp(15px,3.6vw,19px);padding:7px 12px}
 .panel{padding:11px 10px 16px;margin-top:12px}
 .cards{gap:9px}
 .card{aspect-ratio:.88}
 .face{padding:4px;border-radius:14px;border-width:3px}
 .front svg{height:68%}
 .front b{font-size:clamp(12px,3.3vw,17px)}
 .front b.long{font-size:clamp(10px,2.6vw,14px)}
 .back b{font-size:clamp(12px,3.5vw,18px)}
 .message{margin:11px 0 9px}
}
@media (max-height:650px) and (min-width:700px){
 .wrap{padding-top:10px;padding-bottom:14px}
 .hero{padding:9px 12px}
 .title{font-size:clamp(33px,4vw,45px)}
 .instruction{margin-top:5px;padding:5px 13px;font-size:18px}
 .panel{padding:10px 18px;margin-top:9px}
 .cards{max-width:740px;gap:10px}
 .card{aspect-ratio:1.7}
 .front svg{height:70%}
 .progress{margin:6px 0 9px;height:7px}
 .message{min-height:32px;margin:8px 0 7px}
 button.reset{padding:7px 24px}
 .hint{margin-top:8px}
}
.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:20px}.choice{font-family:inherit;font-size:clamp(17px,3.6vw,23px);font-weight:900;line-height:1.4;color:#27546b;background:#fff;border:3px solid #a8d4dd;border-bottom-width:6px;border-radius:19px;padding:15px 10px;min-height:82px;cursor:pointer;touch-action:manipulation;text-align:left}.choice:not(:disabled):active{transform:translateY(2px)}.choice:disabled{cursor:default;opacity:.78}.choice.correct{background:#dbf5e3;border-color:#57ad7c;color:#256f4a;opacity:1}.choice.wrong{background:#ffe5de;border-color:#ec947e;color:#9e4b3b;opacity:1}.feedback{display:none;font-size:clamp(19px,4vw,25px);font-weight:1000;border-radius:16px;margin-top:16px;padding:12px}.feedback.show{display:block}.feedback.right{background:#e2f7e9;color:#21744a}.feedback.not-right{background:#fff0d9;color:#9b5a26}@media(max-width:540px){.choices{grid-template-columns:1fr}.choice{min-height:60px;padding:11px 13px}}</style></head><body><main class="wrap"><header class="hero"><div class="title"><span>長照</span>專業服務<br>挑戰王 👑</div><div class="instruction">翻開卡牌，找出三組相同圖案！</div></header><section class="panel"><div id="play"><div class="stats"><div>配對進度 <strong id="count">0 / 3</strong></div><div>挑戰回合 <strong id="turns">0</strong></div></div><div class="progress"><div id="bar"></div></div><div class="cards" id="cards"></div><div class="message" id="message" aria-live="polite">💡 點選兩張卡片，找出相同圖案！</div></div><div class="finish" id="finish"><div style="font-size:65px">🏆🎉</div><h2>全部配對成功！</h2><div class="question-box"><div class="question-label" id="question-label">🎯 挑戰題目</div><div class="question-text" id="question-text"></div><div class="choices" id="choices" role="group" aria-label="選擇題選項"></div><div class="feedback" id="feedback" aria-live="polite"></div><button class="answer-toggle" type="button" id="answer-toggle" aria-expanded="false">👀 查看正確答案與說明</button><div class="answer" id="answer"><strong>💡 參考答案</strong><div id="answer-text"></div></div></div><p>請先選擇一個答案，再查看解析！</p></div><button class="reset" id="restart">↻ 重新開始</button></section><p class="hint">支援電腦、手機與平板｜不需要網路連線｜錯誤配對自動蓋牌</p></main>
<script>
const art=[
`<svg viewBox="0 0 150 150" xmlns="http://www.w3.org/2000/svg"><rect x="26" y="17" width="98" height="116" rx="15" fill="#F5BB6A" stroke="#9E6239" stroke-width="5" transform="rotate(-7 75 75)"/><rect x="37" y="28" width="78" height="91" rx="9" fill="#fffdf0" transform="rotate(-7 75 75)"/><text x="75" y="68" font-size="28" text-anchor="middle" fill="#157766" font-weight="1000">長照</text><text x="75" y="103" font-size="39" text-anchor="middle" fill="#e87736" font-weight="1000">3.0</text><path d="M20 30l-9 -9M128 30l10 -9M130 115l10 8" stroke="#f6aa3c" stroke-width="6" stroke-linecap="round"/></svg>`,
`<svg viewBox="0 0 150 150" xmlns="http://www.w3.org/2000/svg"><circle cx="75" cy="75" r="62" fill="#e2f5ef"/><path d="M46 29q-15 10-14 28 3 29 35 55 30 24 52 13l7-15-30-19-13 13Q62 91 52 69l12-13-18-27z" fill="#6ab7a8" stroke="#317c79" stroke-width="4"/><rect x="54" y="57" width="89" height="43" rx="21" fill="#f6a33f" stroke="white" stroke-width="4"/><text x="98" y="86" font-size="31" font-weight="1000" text-anchor="middle" fill="white">1966</text><path d="M110 35q21 5 24 25M116 23q30 8 34 35" fill="none" stroke="#f6a33f" stroke-width="5" stroke-linecap="round"/></svg>`,
`<svg viewBox="0 0 150 150" xmlns="http://www.w3.org/2000/svg"><path d="M9 72L75 18l66 54v65H9z" fill="#e4f4e8" stroke="#7fb499" stroke-width="5"/><path d="M17 72L75 25l58 47" stroke="#e9a25e" stroke-width="9" fill="none" stroke-linecap="round"/><circle cx="54" cy="75" r="18" fill="#f2c39f"/><path d="M36 68q4-20 20-18 16 3 17 20" fill="#594639"/><path d="M28 134q0-41 27-42 27 1 29 42" fill="#88bfe1"/><circle cx="108" cy="83" r="20" fill="#f4c8a7"/><path d="M89 80q1-22 19-21 20 2 21 23" fill="#b9b8b4"/><path d="M81 137q0-34 27-34 26 0 28 34" fill="#b7a4cf"/><path d="M74 113q11-10 23-4" stroke="#e8ae88" stroke-width="9" stroke-linecap="round"/><path d="M48 106h13M54 100v13" stroke="white" stroke-width="5"/></svg>`
];
const back=`<svg viewBox="0 0 140 130" xmlns="http://www.w3.org/2000/svg"><path d="M70 112C15 76 6 52 22 32c15-18 36-9 48 6 13-15 34-24 49-6 17 20 6 44-49 80z" fill="#fff7e9" stroke="#265e78" stroke-width="4"/><path d="M40 70l18-12 16 10 15-11 13 13-28 27-15-12-10 2-16-12z" fill="#f6d8b4" stroke="#265e78" stroke-width="3"/><path d="M58 59l14-8 19 16" stroke="#265e78" stroke-width="4" fill="none" stroke-linecap="round"/></svg>`;
const questions=[
 {q:'下列哪一組都是長照3.0提供的專業服務項目？',options:['復能照護、營養照護','代購商品、房屋仲介','旅遊安排、寵物美容','汽車保養、家電維修'],correct:0,a:'專業服務包含：復能照護、個別化服務計畫擬定與執行、營養照護、進食與吞嚥照護、困擾行為照護、臥床或長期活動受限照護、居家環境安全或無障礙空間規劃、居家護理指導與諮詢。'},
 {q:'需要諮詢長照服務，可以撥打哪一個專線？',options:['110','119','1966','1999'],correct:2,a:'長照服務專線是 1966。'},
 {q:'下列哪一組都是可能到府指導或評估的長照專業人員？',options:['導遊、廚師','職能治療師、營養師','汽車技師、會計師','攝影師、房仲'],correct:1,a:'例如職能治療師、物理治療師、營養師、語言治療師、心理師、護理師等相關專業人員。'},
 {q:'長照服務計畫已於115年7月起升級為長照幾點零？',options:['1.0','2.0','4.0','3.0'],correct:3,a:'正確答案是長照 3.0。'},
 {q:'下列哪一種人不符合申請長照服務的條件？',options:['65歲以上、需要長照服務的長輩','55歲以上、需要長照服務的原住民','45歲、因車禍骨折而需要短期照顧的一般民眾','需要長照服務的身心障礙者'],correct:2,a:'申請長照服務需符合指定對象資格，且經評估長照需要等級達第2級以上。車禍受傷需要短期照顧，不代表一定符合長照服務申請資格。'}
];
let deck=[],opened=[],matched=[],turns=0,busy=false,timer=null,lastNumber=null;
const $=id=>document.getElementById(id);
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function init(){clearTimeout(timer);deck=shuffle([0,0,1,1,2,2]);opened=[];matched=[];turns=0;busy=false;$('play').style.display='block';$('finish').classList.remove('show');$('cards').innerHTML='';deck.forEach((type,i)=>{const el=document.createElement('button');el.className='card';el.type='button';el.setAttribute('aria-label',`第${i+1}張卡片`);el.innerHTML=`<div class="inner"><div class="face back">${back}<b>長照3.0</b></div><div class="face front">${art[type]}<b class="${type===2?'long':''}">${['長照3.0','1966','專業人員到宅服務'][type]}</b></div></div>`;el.addEventListener('click',()=>flip(i));$('cards').append(el)});update();$('message').textContent='💡 點選兩張卡片，找出相同圖案！'}
function update(){$('count').textContent=`${matched.length} / 3`;$('turns').textContent=turns;$('bar').style.width=(matched.length/3*100)+'%'}
function flip(i){if(busy||opened.includes(i)||matched.includes(deck[i]))return;const cards=$('cards').children;cards[i].classList.add('flipped');opened.push(i);if(opened.length!==2)return;busy=true;turns++;update();const [a,b]=opened;if(deck[a]===deck[b]){timer=setTimeout(()=>{cards[a].classList.add('matched');cards[b].classList.add('matched');matched.push(deck[a]);opened=[];busy=false;update();$('message').textContent='🎉 配對成功！繼續找下一組！';if(matched.length===3)timer=setTimeout(finish,650)},480)}else{$('message').textContent='👀 不一樣喔！記住卡片位置～';timer=setTimeout(()=>{cards[a].classList.remove('flipped');cards[b].classList.remove('flipped');opened=[];busy=false;$('message').textContent='💡 再試一次，找出相同圖案！'},1100)}}
function finish(){let n=1+Math.floor(Math.random()*5);if(n===lastNumber)n=n%5+1;lastNumber=n;const q=questions[n-1];$('question-label').textContent=`🎯 第 ${n} 題`; $('question-text').textContent=q.q;$('answer-text').textContent=q.a;$('answer').classList.remove('show');$('answer-toggle').textContent='👀 查看正確答案與說明';$('answer-toggle').setAttribute('aria-expanded','false');$('feedback').textContent='';$('feedback').className='feedback';$('choices').innerHTML='';const letters=['A','B','C','D'];q.options.forEach((option,i)=>{const btn=document.createElement('button');btn.type='button';btn.className='choice';btn.textContent=`${letters[i]}. ${option}`;btn.addEventListener('click',()=>{Array.from($('choices').children).forEach((b,j)=>{b.disabled=true;if(j===q.correct)b.classList.add('correct');else if(j===i)b.classList.add('wrong')});const ok=i===q.correct;$('feedback').className='feedback show '+(ok?'right':'not-right');$('feedback').textContent=ok?'🎉 答對了！':'💡 再記住這個知識！正確答案是 '+letters[q.correct]+'。';$('answer').classList.add('show');$('answer-toggle').textContent='🙈 隱藏答案與說明';$('answer-toggle').setAttribute('aria-expanded','true')});$('choices').append(btn)});$('play').style.display='none';$('finish').classList.add('show')}
$('answer-toggle').addEventListener('click',()=>{const visible=$('answer').classList.toggle('show');$('answer-toggle').textContent=visible?'🙈 隱藏答案與說明':'👀 查看正確答案與說明';$('answer-toggle').setAttribute('aria-expanded',String(visible))});
$('restart').addEventListener('click',init);init();
</script></body></html>

auto 0;cursor:pointer;touch-action:manipulation}.answer{display:none;background:#e7f6ed;border:3px solid #98d2b2;border-radius:18px;margin-top:14px;padding:15px;text-align:left;font-size:clamp(19px,4.1vw,25px);font-weight:800;line-height:1.65;color:#256a58}.answer.show{display:block}.answer strong{display:block;color:#28745c;margin-bottom:5px}.hotline{background:#e8f6ec;border-radius:18px;padding:14px;font-size:clamp(19px,4vw,25px);font-weight:900;color:#286f57}.hint{font-size:15px;color:#6c807f;margin:15px 0 0}@media(max-width:390px){.cards{gap:7px}.face{border-width:3px;border-radius:14px;padding:4px}.panel{padding:10px}}

.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:20px}.choice{font-family:inherit;font-size:clamp(17px,3.6vw,23px);font-weight:900;line-height:1.4;color:#27546b;background:#fff;border:3px solid #a8d4dd;border-bottom-width:6px;border-radius:19px;padding:15px 10px;min-height:82px;cursor:pointer;touch-action:manipulation;text-align:left}.choice:not(:disabled):active{transform:translateY(2px)}.choice:disabled{cursor:default;opacity:.78}.choice.correct{background:#dbf5e3;border-color:#57ad7c;color:#256f4a;opacity:1}.choice.wrong{background:#ffe5de;border-color:#ec947e;color:#9e4b3b;opacity:1}.feedback{display:none;font-size:clamp(19px,4vw,25px);font-weight:1000;border-radius:16px;margin-top:16px;padding:12px}.feedback.show{display:block}.feedback.right{background:#e2f7e9;color:#21744a}.feedback.not-right{background:#fff0d9;color:#9b5a26}@media(max-width:540px){.choices{grid-template-columns:1fr}.choice{min-height:60px;padding:11px 13px}}

</style></head><body><main class="wrap"><header class="hero"><div class="title"><span>長照</span>專業服務<br>挑戰王 👑</div><div class="instruction">翻開卡牌，找出三組相同圖案！</div></header><section class="panel"><div id="play"><div class="stats"><div>配對進度 <strong id="count">0 / 3</strong></div><div>挑戰回合 <strong id="turns">0</strong></div></div><div class="progress"><div id="bar"></div></div><div class="cards" id="cards"></div><div class="message" id="message" aria-live="polite">💡 點選兩張卡片，找出相同圖案！</div></div><div class="finish" id="finish"><div style="font-size:65px">🏆🎉</div><h2>全部配對成功！</h2><div class="question-box"><div class="question-label" id="question-label">🎯 挑戰題目</div><div class="question-text" id="question-text"></div><div class="choices" id="choices" role="group" aria-label="選擇題選項"></div><div class="feedback" id="feedback" aria-live="polite"></div><button class="answer-toggle" type="button" id="answer-toggle" aria-expanded="false">👀 查看正確答案與說明</button><div class="answer" id="answer"><strong>💡 參考答案</strong><div id="answer-text"></div></div></div><p>請先選擇一個答案，再查看解析！</p></div><button class="reset" id="restart">↻ 重新開始</button></section><p class="hint">支援電腦、手機與平板｜不需要網路連線｜錯誤配對自動蓋牌</p></main>
<script>
const art=[
`<svg viewBox="0 0 150 150" xmlns="http://www.w3.org/2000/svg"><circle cx="75" cy="75" r="65" fill="#e7f5ec"/><ellipse cx="75" cy="104" rx="47" ry="14" fill="#f8bc78"/><path d="M38 93q37 32 74 0" fill="none" stroke="#b56c4a" stroke-width="6" stroke-linecap="round"/><path d="M43 75q32 25 64 0" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round"/><path d="M35 33v38M27 33v21M43 33v21M35 69v35" stroke="#599fa7" stroke-width="6" stroke-linecap="round"/><path d="M117 33q-20 10-9 33h11v37" stroke="#599fa7" stroke-width="7" fill="none" stroke-linecap="round"/><circle cx="76" cy="59" r="16" fill="#f3c7a5"/><path d="M60 53q3-20 20-15 13 4 12 17" fill="#715548"/><path d="M56 101q1-28 20-28t20 28" fill="#88c8bd"/></svg>`,
`<svg viewBox="0 0 150 150" xmlns="http://www.w3.org/2000/svg"><circle cx="75" cy="75" r="65" fill="#fff0df"/><circle cx="75" cy="53" r="23" fill="#f2c7a7"/><path d="M51 48q2-26 26-25 22 2 23 27" fill="#6b584b"/><path d="M36 133q3-51 39-51t39 51" fill="#87b5df"/><path d="M49 98l-20-15M102 99l20-16" stroke="#87b5df" stroke-width="12" stroke-linecap="round"/><path d="M60 57h7m17 0h7" stroke="#654b3d" stroke-width="4" stroke-linecap="round"/><path d="M65 69q10 8 20 0" fill="none" stroke="#a56b61" stroke-width="3" stroke-linecap="round"/><path d="M112 27q17-10 25 6-1 16-24 23" fill="#ffe29b" stroke="#d6a34c" stroke-width="3"/><text x="124" y="46" text-anchor="middle" font-size="19" font-weight="bold" fill="#966331">♥</text></svg>`,
`<svg viewBox="0 0 150 150" xmlns="http://www.w3.org/2000/svg"><circle cx="75" cy="75" r="65" fill="#e6f2fc"/><rect x="42" y="20" width="73" height="111" rx="9" fill="#fffef9" stroke="#6da6bd" stroke-width="5"/><rect x="59" y="14" width="39" height="17" rx="6" fill="#f3b76b"/><path d="M56 53l7 7 11-14M80 53h23M56 82l7 7 11-14M80 82h23M56 110l7 7 11-14M80 110h23" fill="none" stroke="#5bafa0" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="30" cy="103" r="16" fill="#f3c6a4"/><path d="M9 137q2-22 21-22 20 0 22 22" fill="#efab7c"/></svg>`
];
const back=`<svg viewBox="0 0 140 130" xmlns="http://www.w3.org/2000/svg"><path d="M70 112C15 76 6 52 22 32c15-18 36-9 48 6 13-15 34-24 49-6 17 20 6 44-49 80z" fill="#fff7e9" stroke="#265e78" stroke-width="4"/><path d="M40 70l18-12 16 10 15-11 13 13-28 27-15-12-10 2-16-12z" fill="#f6d8b4" stroke="#265e78" stroke-width="3"/><path d="M58 59l14-8 19 16" stroke="#265e78" stroke-width="4" fill="none" stroke-linecap="round"/></svg>`;
const questions=[
 {q:'下列哪一項屬於長照3.0的專業服務項目？',options:['居家清潔打掃','進食與吞嚥照護','代購生活用品','陪同逛街購物'],correct:1,a:'進食與吞嚥照護屬於長照專業服務，透過專業評估及指導，協助有進食或吞嚥困難的個案。'},
 {q:'長照專業服務中的「困擾行為照護」，主要協助處理哪種情況？',options:['居家環境清潔','外出交通安排','個案出現影響生活或照顧的行為問題','家庭財務管理'],correct:2,a:'困擾行為照護由專業人員評估行為問題，提供適當的介入策略及照顧指導。'},
 {q:'下列哪一項最符合「個別化服務計畫擬定與執行」的內容？',options:['依個案需求規劃生活自理與社區適應訓練','統一安排所有個案相同的活動','提供一般家事清潔','協助繳交水電費'],correct:0,a:'個別化服務計畫依個案狀況及需求，規劃並執行適合的服務，促進生活自理、社交及社區適應。'},
 {q:'下列哪一項「不是」長照3.0的專業服務項目？',options:['營養照護','居家環境安全或無障礙空間規劃','臥床或長期活動受限照護','定期到府代洗衣服'],correct:3,a:'營養照護、居家環境安全或無障礙空間規劃，以及臥床或長期活動受限照護，都是長照專業服務項目；代洗衣服不屬於這裡所列的專業服務項目。'},
 {q:'下列哪一組人員可提供長照專業服務的到府指導或評估？',options:['職能治療師、營養師、語言治療師','房屋仲介、保險業務員、會計師','水電技師、清潔人員、司機','銷售人員、導遊、攝影師'],correct:0,a:'長照專業服務可由職能治療師、物理治療師、營養師、語言治療師、心理師、護理師等相關專業人員提供到府評估或指導。'}
];
let deck=[],opened=[],matched=[],turns=0,busy=false,timer=null,lastNumber=null;
const $=id=>document.getElementById(id);
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function init(){clearTimeout(timer);deck=shuffle([0,0,1,1,2,2]);opened=[];matched=[];turns=0;busy=false;$('play').style.display='block';$('finish').classList.remove('show');$('cards').innerHTML='';deck.forEach((type,i)=>{const el=document.createElement('button');el.className='card';el.type='button';el.setAttribute('aria-label',`第${i+1}張卡片`);el.innerHTML=`<div class="inner"><div class="face back">${back}<b>長照3.0</b></div><div class="face front">${art[type]}<b class="${'long'}">${['進食與吞嚥照護','困擾行為照護','個別化服務計畫擬定與執行'][type]}</b></div></div>`;el.addEventListener('click',()=>flip(i));$('cards').append(el)});update();$('message').textContent='💡 點選兩張卡片，找出相同圖案！'}
function update(){$('count').textContent=`${matched.length} / 3`;$('turns').textContent=turns;$('bar').style.width=(matched.length/3*100)+'%'}
function flip(i){if(busy||opened.includes(i)||matched.includes(deck[i]))return;const cards=$('cards').children;cards[i].classList.add('flipped');opened.push(i);if(opened.length!==2)return;busy=true;turns++;update();const [a,b]=opened;if(deck[a]===deck[b]){timer=setTimeout(()=>{cards[a].classList.add('matched');cards[b].classList.add('matched');matched.push(deck[a]);opened=[];busy=false;update();$('message').textContent='🎉 配對成功！繼續找下一組！';if(matched.length===3)timer=setTimeout(finish,650)},480)}else{$('message').textContent='👀 不一樣喔！記住卡片位置～';timer=setTimeout(()=>{cards[a].classList.remove('flipped');cards[b].classList.remove('flipped');opened=[];busy=false;$('message').textContent='💡 再試一次，找出相同圖案！'},1100)}}
function finish(){let n=1+Math.floor(Math.random()*5);if(n===lastNumber)n=n%5+1;lastNumber=n;const q=questions[n-1];$('question-label').textContent=`🎯 第 ${n} 題`; $('question-text').textContent=q.q;$('answer-text').textContent=q.a;$('answer').classList.remove('show');$('answer-toggle').textContent='👀 查看正確答案與說明';$('answer-toggle').setAttribute('aria-expanded','false');$('feedback').textContent='';$('feedback').className='feedback';$('choices').innerHTML='';const letters=['A','B','C','D'];q.options.forEach((option,i)=>{const btn=document.createElement('button');btn.type='button';btn.className='choice';btn.textContent=`${letters[i]}. ${option}`;btn.addEventListener('click',()=>{Array.from($('choices').children).forEach((b,j)=>{b.disabled=true;if(j===q.correct)b.classList.add('correct');else if(j===i)b.classList.add('wrong')});const ok=i===q.correct;$('feedback').className='feedback show '+(ok?'right':'not-right');$('feedback').textContent=ok?'🎉 答對了！':'💡 再記住這個知識！正確答案是 '+letters[q.correct]+'。';$('answer').classList.add('show');$('answer-toggle').textContent='🙈 隱藏答案與說明';$('answer-toggle').setAttribute('aria-expanded','true')});$('choices').append(btn)});$('play').style.display='none';$('finish').classList.add('show')}
$('answer-toggle').addEventListener('click',()=>{const visible=$('answer').classList.toggle('show');$('answer-toggle').textContent=visible?'🙈 隱藏答案與說明':'👀 查看正確答案與說明';$('answer-toggle').setAttribute('aria-expanded',String(visible))});
$('restart').addEventListener('click',init);init();
</script></body></html>

*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#fff9f0,#eaf1ef);color:#314b5a;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;min-height:100vh;display:grid;place-items:center}.app{width:min(96vw,700px);padding:22px 12px;text-align:center}.eyebrow{color:#aa835f;font-size:12px;font-weight:700;letter-spacing:2px}h1{margin:6px 0;font-size:clamp(25px,5vw,38px)}.sub{margin:0 0 20px;color:#74838b}.status{display:flex;justify-content:space-between;font-weight:650;margin:0 4px 10px}.track{height:7px;border-radius:10px;background:#e7ddd0;overflow:hidden;margin-bottom:20px}.fill{height:100%;width:0;background:#83ab99;transition:width .3s}.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(7px,2vw,15px)}.card{aspect-ratio:.82;position:relative;border:0;padding:0;background:transparent;cursor:pointer;perspective:1000px;touch-action:manipulation}.inner{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .4s}.card.open .inner,.card.matched .inner{transform:rotateY(180deg)}.face{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;border-radius:15px;border:3px solid #e5ceb1;box-shadow:0 4px 13px #35516c24;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden}.back{background:#7299ab;color:white}.logo{border:2px solid #f5ecdd;border-radius:50%;width:62%;aspect-ratio:1;display:grid;place-items:center;font-size:clamp(25px,6vw,48px);font-family:Georgia,serif}.front{transform:rotateY(180deg);background:#fffdf8;padding:5px}.front img{display:block;width:100%;height:calc(100% - 26px);object-fit:contain;pointer-events:none}.caption{font-size:clamp(10px,2vw,16px);font-weight:700;color:#355765;white-space:nowrap}.matched .face{border-color:#77ab8d}.hint{color:#75838b;margin:18px 0 12px;font-size:14px}.action{border:0;border-radius:99px;background:#365f7a;color:white;font-size:16px;font-weight:700;padding:13px 28px;cursor:pointer}.win{display:none;background:white;border:2px solid #e0c69d;border-radius:20px;padding:30px 12px;margin-top:16px}.win h2{font-size:29px}.number{font-size:100px;font-weight:800;color:#365f7a}.app.done .board,.app.done .status,.app.done .track,.app.done .hint,.app.done #reset{display:none}.app.done .win{display:block}@media(max-width:430px){.face{border-radius:10px;border-width:2px}.front{padding:2px}.front img{height:calc(100% - 22px)}.caption{font-size:10px}}

const LABELS=['復能照護','照護計畫','進食與吞嚥照護'];
const board=document.getElementById('board');
const app=document.getElementById('app');
let deck=[],opened=[],matchedPairs=0,turns=0,locked=false,round=0;
function shuffledDeck(){
 const arr=[0,0,1,1,2,2];
 for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}
 return arr;
}
function update(){document.getElementById('progress').textContent=`配對進度 ${matchedPairs} / 3`;document.getElementById('turns').textContent=`挑戰回合 ${turns}`;document.getElementById('fill').style.width=`${matchedPairs/3*100}%`;}
function start(){round++;deck=shuffledDeck();opened=[];matchedPairs=0;turns=0;locked=false;app.classList.remove('done');board.replaceChildren();
 // Each card's image is assigned exactly once at round start. Never reassign it on flip.
 deck.forEach((type,index)=>{const button=document.createElement('button');button.type='button';button.className='card';button.setAttribute('aria-label',`第 ${index+1} 張卡牌`);const inner=document.createElement('div');inner.className='inner';const back=document.createElement('div');back.className='face back';back.innerHTML='<div class="logo">OT</div>';const front=document.createElement('div');front.className='face front';const img=document.createElement('img');img.src=IMAGES[type];img.alt=LABELS[type];img.draggable=false;const caption=document.createElement('span');caption.className='caption';caption.textContent=LABELS[type];front.append(img,caption);inner.append(back,front);button.append(inner);button.addEventListener('click',()=>flip(index,button));board.append(button);});update();}
function flip(index,button){if(locked||button.classList.contains('open')||button.classList.contains('matched'))return;button.classList.add('open');opened.push({index,button});if(opened.length!==2)return;locked=true;turns++;update();const [a,b]=opened;const thisRound=round;const same=deck[a.index]===deck[b.index];setTimeout(()=>{if(thisRound!==round)return;if(same){a.button.classList.add('matched');b.button.classList.add('matched');matchedPairs++;}else{a.button.classList.remove('open');b.button.classList.remove('open');}opened=[];locked=false;update();if(same&&matchedPairs===3){document.getElementById('number').textContent=String(Math.floor(Math.random()*5)+1);setTimeout(()=>{if(thisRound===round)app.classList.add('done')},500)}},same?450:1100);}
document.getElementById('reset').addEventListener('click',start);document.getElementById('again').addEventListener('click',start);start();
</script></body></html>
